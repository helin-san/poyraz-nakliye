    <circle cx="43" cy="105" r="8" fill="#0B1F3A"/>
    <circle cx="123" cy="105" r="20" fill="#FFFFFF"/>
    <circle cx="123" cy="105" r="8" fill="#0B1F3A"/>
  </g>

  <!-- kelime markası -->
  <text x="250" y="95" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="54" font-weight="800" fill="#0B1F3A">Poyraz</text>
  <text x="250" y="134" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="5" fill="#FF7A21">NAKLİYE</text>
